<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@300;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d14;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #ff6b6b;
      --accent2: #ffd166;
      --text: #f0f0f5;
      --muted: rgba(240,240,245,0.45);
      --ring-size: 200px;
      --ring-stroke: 10;
    }

    body {
      width: 320px;
      min-height: 380px;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px 20px;
      gap: 20px;
      overflow: hidden;
    }

    /* Ambient glow blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: 0.25;
    }
    body::before {
      width: 200px; height: 200px;
      background: var(--accent);
      top: -60px; left: -40px;
    }
    body::after {
      width: 160px; height: 160px;
      background: #7b5ea7;
      bottom: -40px; right: -30px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .session-badge {
      margin-left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .session-badge span { color: var(--accent2); }

    /* Mode tabs */
    .mode-tabs {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      gap: 2px;
      width: 100%;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), #ff8f8f);
      color: white;
      box-shadow: 0 2px 8px rgba(255,107,107,0.35);
    }
    .tab-btn:hover:not(.active) {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    /* Ring timer */
    .ring-container {
      position: relative;
      width: var(--ring-size);
      height: var(--ring-size);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: var(--border);
      stroke-width: var(--ring-stroke);
    }
    .ring-progress {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: var(--ring-stroke);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }
    .ring-pulse {
      fill: none;
      stroke: rgba(255,107,107,0.15);
      stroke-width: 22;
      stroke-linecap: round;
    }

    .timer-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      z-index: 1;
    }
    #time-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 60%, rgba(255,255,255,0.6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .timer-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    /* Running pulse animation applied to ring-progress */
    @keyframes ringPulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(255,107,107,0.5)); }
      50%       { filter: drop-shadow(0 0 10px rgba(255,107,107,0.9)); }
    }
    .running .ring-progress { animation: ringPulse 2s ease-in-out infinite; }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #ff8f8f 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(255,107,107,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,107,107,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary.paused {
      background: linear-gradient(135deg, #06d6a0 0%, #40e0c0 100%);
      box-shadow: 0 4px 16px rgba(6,214,160,0.35);
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      max-width: 52px;
      flex: none;
    }
    .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); }

    /* Session dots */
    .session-dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s ease;
    }
    .dot.done {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(255,107,107,0.6);
    }
    .dot.current {
      background: var(--accent2);
      box-shadow: 0 0 6px rgba(255,209,102,0.6);
      animation: dotPulse 1.5s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.35); }
    }

    /* Finish flash */
    @keyframes finishFlash {
      0%   { background: var(--bg); }
      20%  { background: rgba(255,107,107,0.15); }
      40%  { background: var(--bg); }
      60%  { background: rgba(255,107,107,0.12); }
      80%  { background: var(--bg); }
      100% { background: var(--bg); }
    }
    body.done { animation: finishFlash 1.2s ease; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">🍅</div>
    <h1>Pomodoro</h1>
    <div class="session-badge">Session <span id="session-num">1</span>/4</div>
  </div>

  <!-- Mode tabs -->
  <div class="mode-tabs" role="tablist">
    <button class="tab-btn active" id="tab-pomo"   data-duration="1500" role="tab">Focus</button>
    <button class="tab-btn"        id="tab-short"  data-duration="300"  role="tab">Short Break</button>
    <button class="tab-btn"        id="tab-long"   data-duration="900"  role="tab">Long Break</button>
  </div>

  <!-- Ring timer -->
  <div class="ring-container" id="ring-container">
    <svg class="ring-svg" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#ff6b6b"/>
          <stop offset="100%" stop-color="#ffd166"/>
        </linearGradient>
      </defs>
      <circle class="ring-track"    cx="100" cy="100" r="88"/>
      <circle class="ring-progress" cx="100" cy="100" r="88" id="ring-arc"/>
    </svg>
    <div class="timer-center">
      <div id="time-display">25:00</div>
      <div class="timer-label" id="timer-label">Focus Time</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="start-btn">▶ Start</button>
    <button class="btn btn-secondary" id="reset-btn" title="Reset">↺</button>
  </div>

  <!-- Session dots -->
  <div class="session-dots" id="session-dots">
    <div class="dot current" data-i="0"></div>
    <div class="dot" data-i="1"></div>
    <div class="dot" data-i="2"></div>
    <div class="dot" data-i="3"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
